<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Stake Censor - uncensored logo on the left, censored on the right">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f212e"/>
      <stop offset="1" stop-color="#1a2c38"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1280" height="320" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="1276" height="316" rx="20" fill="none" stroke="#2f4553" stroke-width="2"/>

  <!-- uncensored logo (left) -->
  <text x="360" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">STAKE</text>

  <!-- arrow -->
  <g stroke="#00e701" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="590" y1="160" x2="690" y2="160"/>
    <polyline points="665,138 690,160 665,182"/>
  </g>

  <!-- censored logo (right) -->
  <text x="920" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff" filter="url(#blur)">STAKE</text>
</svg>
